services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://atelia:atelia@db:5432/atelia
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atelia
      POSTGRES_PASSWORD: atelia
      POSTGRES_DB: atelia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelia -d atelia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
