services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://atelia:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis — voir .env.example}@db:5432/atelia
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atelia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis — voir .env.example}
      POSTGRES_DB: atelia
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atelia -d atelia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
