[project]
name = "atelia"
version = "0.1.0"
description = "AtelIA — atelier IA d'une PME agroalimentaire fictive — plateforme de démonstration AI Engineering, souveraine"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "litellm>=1.55",
    "asyncpg>=0.30",
    "pydantic-settings>=2.6",
    "factur-x>=3.1",
    "lxml>=5.3",
    "jinja2>=3.1",
    "python-multipart>=0.0.18",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "reportlab>=4.2",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
